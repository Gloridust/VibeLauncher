name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev xdg-utils desktop-file-utils libglib2.0-bin
      - name: Test core and command
        run: cargo test -p vl-core -p vibelauncher
      # Unit tests of the window: translations, update feed and signatures.
      - name: Test window
        run: cargo test -p vibelauncher-gui
      # Drives the real command on this OS against a stand-in app: launching
      # with an isolated data folder, process detection, the "lost settings"
      # diagnosis and fix, sign-in routing, taking over the claude:// handler
      # (and the OS delivering a link through it), shortcuts, deletion.
      - name: End-to-end on this OS
        timeout-minutes: 10
        env:
          VL_SMOKE: ci
        run: cargo test -p vibelauncher --features smoke-test --test smoke -- --nocapture
