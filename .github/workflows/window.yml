name: Window

# Opens the real manager window on every system, keeps screenshots, and clicks
# through it (app/src-tauri/src/selftest.rs), so the window is checked on
# systems nobody here uses day to day.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: window-${{ github.ref }}
  cancel-in-progress: true

jobs:
  window:
    name: Window (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: window
      - name: Linux dependencies (a screen to open the window on, and to photograph it)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 xvfb imagemagick xdg-utils desktop-file-utils libglib2.0-bin
      - name: Build the command and a stand-in app
        run: cargo build --release --locked -p vibelauncher --features vibelauncher/smoke-test
      - name: Build the window, with the click-through test
        run: cargo build --release --locked -p vibelauncher-gui --features selftest
      - name: Open the window, take screenshots and click through it
        shell: bash
        timeout-minutes: 10
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" bash .github/scripts/window-check.sh
          else
            bash .github/scripts/window-check.sh
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-${{ matrix.os }}
          path: window-shots
